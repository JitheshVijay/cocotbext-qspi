name: Release

# Two stages, so a first release can be rehearsed before it is permanent.
#
#   push a tag   ->  builds, checks, publishes to TestPyPI
#   publish a
#   GitHub Release for that tag  ->  publishes to the real PyPI
#
# Pushing the tag is therefore safe: it cannot reach pypi.org on its own.
# Look at the TestPyPI page first, install from it, and only then create the
# Release. A version number on either index can never be reused, which is
# why the real one waits for a deliberate second action.
#
# Both stages use PyPI Trusted Publishing (OIDC): no API token exists, and
# nothing is stored in this repository. Register a publisher on each index
# before the first run --
#
#   https://pypi.org/manage/account/publishing/
#   https://test.pypi.org/manage/account/publishing/
#
#     PyPI project name   cocotbext-qspi
#     Owner               JitheshVijay
#     Repository name     cocotbext-qspi
#     Workflow name       release.yml
#     Environment name    pypi        (on pypi.org)
#                         testpypi    (on test.pypi.org)

on:
  push:
    tags: ['v*']
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # A distribution that will not render on PyPI, or that is missing
      # files, is not worth publishing.
      - name: Check metadata
        run: python -m twine check dist/*

      # Both of the gates below exist because the mistake was actually made
      # and caught by hand before the first release.
      - name: Check the Verilog shipped
        run: |
          set -e
          for whl in dist/*.whl; do
            count=$(unzip -l "$whl" | grep -cE '\.(v|vh)$' || true)
            echo "$whl carries $count HDL files"
            if [ "$count" -eq 0 ]; then
              echo "::error::no Verilog in the wheel; the package would be unusable"
              exit 1
            fi
          done

      - name: Check README images are absolute
        run: |
          python -m pip install "readme_renderer[md]"
          python - <<'EOF'
          import re, sys
          import readme_renderer.markdown as md
          html = md.render(open("README.md").read())
          bad = [s for s in re.findall(r'<img[^>]*src="([^"]+)"', html)
                 if not s.startswith("https://")]
          if bad:
              print("relative README image(s):", *bad, sep="\n  ")
              print("they resolve against pypi.org and 404")
              sys.exit(1)
          print("all README images absolute")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Rehearsal. Reached by pushing a tag.
  testpypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # The real thing. Reached by publishing a GitHub Release for the tag.
  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
