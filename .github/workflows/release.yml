name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC), so there is no API token to store or
# leak: PyPI is configured to trust this repository and workflow, and the
# short-lived credential is minted per run.
#
# Before the first release, add a trusted publisher on PyPI:
#   owner       JitheshVijay
#   repository  <this repo>
#   workflow    release.yml
#   environment pypi

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # A distribution that will not render on PyPI, or that is missing
      # files, is not worth publishing.
      - name: Check metadata
        run: python -m twine check dist/*

      - name: Check the Verilog shipped
        run: |
          set -e
          for whl in dist/*.whl; do
            count=$(unzip -l "$whl" | grep -cE '\.(v|vh)$' || true)
            echo "$whl carries $count HDL files"
            if [ "$count" -eq 0 ]; then
              echo "::error::no Verilog in the wheel; the package would be unusable"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
